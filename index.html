<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>フィギュア完全一致検索</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f1eaff,#fff);color:#1d1930}
.wrap{max-width:920px;margin:auto;padding:24px 16px 60px}.title{text-align:center;font-size:clamp(28px,6vw,48px);font-weight:800;margin:0}.sub{text-align:center;color:#756889;margin:8px 0 22px}
.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 8px 30px #5f3dc41a}label{font-weight:800;font-size:20px}
textarea{width:100%;min-height:110px;margin-top:10px;padding:16px;border:2px solid #e3daf2;border-radius:18px;font-size:18px;resize:vertical}
.ocr{border:2px dashed #cbb9ed;border-radius:18px;padding:16px;margin-bottom:20px;background:#faf7ff}.ocr h2{margin:0 0 8px;font-size:21px}
input[type=file]{width:100%;margin:8px 0 12px}.btn{width:100%;border:0;border-radius:16px;padding:16px;font-weight:800;font-size:17px;cursor:pointer;background:linear-gradient(90deg,#6e35d5,#8a57e7);color:white}
.btn.secondary{background:#eee8f8;color:#392665}.btn:disabled{opacity:.55;cursor:wait}
#preview{display:none;max-width:100%;max-height:330px;margin:12px auto;border-radius:14px}.status{min-height:26px;margin:10px 0;color:#65557b;font-weight:650}
.note{font-size:14px;color:#776b86;margin:10px 2px 18px}.sites{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.site{display:block;text-align:center;padding:17px 8px;border:1px solid #e2d8ef;border-radius:16px;background:#f8f5fc;text-decoration:none;color:#211a31;font-weight:800}.site small{display:block;color:#796b87;font-weight:500;margin-top:4px}
@media(max-width:620px){.sites{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<h1 class="title">🔎 フィギュア完全一致検索</h1>
<p class="sub">写真の文字を無料OCR → 商品名にして検索</p>
<div class="card">
  <div class="ocr">
    <h2>📷 写真から商品名を読み取る</h2>
    <div>箱・袋・タグなど、商品名の文字が見える写真を選択してください。</div>
    <input id="photo" type="file" accept="image/*">
    <img id="preview" alt="選択した写真">
    <button id="ocrBtn" class="btn secondary" disabled>📖 写真の文字を読み取る</button>
    <div id="status" class="status"></div>
  </div>

  <label for="q">商品名</label>
  <textarea id="q" placeholder="OCR結果がここに入ります。手入力・修正もできます。"></textarea>
  <div class="note">OCRは端末内のブラウザで動作します。初回はOCRライブラリと言語データの読み込みに時間がかかる場合があります。読み取り結果は検索前に確認・修正できます。</div>
  <button id="searchBtn" class="btn">🔍 検索先を表示</button>
  <div id="sites" class="sites"></div>
</div>
</div>
<script>
const photo=document.getElementById('photo'), preview=document.getElementById('preview'),
ocrBtn=document.getElementById('ocrBtn'), statusEl=document.getElementById('status'),
q=document.getElementById('q'), sites=document.getElementById('sites');
let imageURL=null;

photo.addEventListener('change',()=>{
 const f=photo.files[0]; if(!f)return;
 if(imageURL) URL.revokeObjectURL(imageURL);
 imageURL=URL.createObjectURL(f); preview.src=imageURL; preview.style.display='block';
 ocrBtn.disabled=false; statusEl.textContent='写真を選択しました。';
});

function makeSearchText(raw){
 const lines=raw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
 const keep=lines.filter(s=>{
   const x=s.toLowerCase();
   if(/注意|ちゅうい|対象年齢|ご使用前|事故|絶対|保護者|パッケージ|電話|tel|http|www|材質|prize only|made in|使用上/.test(x)) return false;
   return /初音|ミク|wonderland|フィギュア|限定|タイトー|taito|雪姫|ver|figure|online|クレーン/i.test(x);
 });
 let result=keep.join(' ').replace(/\s+/g,' ').trim();
 return result || lines.slice(0,8).join(' ').replace(/\s+/g,' ').trim();
}

ocrBtn.addEventListener('click',async()=>{
 if(!photo.files[0])return;
 ocrBtn.disabled=true; statusEl.textContent='OCR準備中…（初回は少し時間がかかります）';
 try{
   const result=await Tesseract.recognize(photo.files[0],'jpn+eng',{
     logger:m=>{
       if(m.status==='recognizing text') statusEl.textContent=`文字を読み取り中… ${Math.round((m.progress||0)*100)}%`;
       else if(m.status) statusEl.textContent='OCR処理中…';
     }
   });
   const raw=result.data.text||'';
   const cleaned=makeSearchText(raw);
   q.value=cleaned;
   localStorage.setItem('figureQuery',cleaned);
   statusEl.textContent=cleaned ? '✅ 読み取り完了。商品名を確認して検索してください。' : '⚠️ 文字をうまく読み取れませんでした。';
 }catch(e){
   console.error(e); statusEl.textContent='⚠️ OCRに失敗しました。別の写真か、商品名の手入力を試してください。';
 }finally{ocrBtn.disabled=false}
});

function add(label,desc,url){
 const a=document.createElement('a');a.className='site';a.target='_blank';a.rel='noopener';
 a.href=url;a.innerHTML=`${label}<small>${desc}</small>`;sites.appendChild(a);
}
document.getElementById('searchBtn').addEventListener('click',()=>{
 const s=q.value.trim(); if(!s){alert('商品名を入力してください');return}
 localStorage.setItem('figureQuery',s); const e=encodeURIComponent(s); sites.innerHTML='';
 add('🖼 Google画像','まず画像で外観を確認',`https://www.google.com/search?tbm=isch&q=${e}`);
 add('🖼 Bing画像','別エンジンでも照合',`https://www.bing.com/images/search?q=${e}`);
 add('🌐 Google検索','公式・商品ページを探す',`https://www.google.com/search?q=${e}`);
 add('🏢 公式情報を探す','商品名＋公式で検索',`https://www.google.com/search?q=${encodeURIComponent(s+' 公式')}`);
 add('🏬 駿河屋を探す','商品ページ候補',`https://www.google.com/search?q=${encodeURIComponent('site:suruga-ya.jp '+s)}`);
 add('🏬 あみあみを探す','商品情報候補',`https://www.google.com/search?q=${encodeURIComponent('site:amiami.jp '+s)}`);
 add('🐈 メルカリ検索','出品を検索',`https://jp.mercari.com/search?keyword=${e}`);
 add('🛍 Yahoo!検索','販売・出品を検索',`https://search.yahoo.co.jp/search?p=${e}`);
 sites.scrollIntoView({behavior:'smooth',block:'start'});
});
q.value=localStorage.getItem('figureQuery')||'';
</script>
</body></html>
